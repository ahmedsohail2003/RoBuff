<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Hand-controlled robot arm</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e8eaee; font-family: system-ui, sans-serif; }
      #viewport { position: fixed; inset: 0; }
      #viewport canvas { display: block; }
      #hand-view { position: fixed; right: 12px; bottom: 12px; width: 240px; height: 180px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
      #notice { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); max-width: 460px; padding: 12px 16px; background: #fff; border: 1px solid #c33; border-radius: 4px; font-size: 14px; }
      #notice p { margin: 0 0 10px; }
      #notice button { font: inherit; padding: 4px 12px; }
      #status { position: fixed; left: 12px; top: 12px; padding: 6px 10px; background: #fff; border-radius: 4px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="status" role="status">Loading physics</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
